{% load static %}

<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="theme-color"
        content="#f5f5f7"
    >

    <title>
        {% block title %}LedgerFlow{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'css/ledgerflow.css' %}"
    >

</head>


<body>

<div class="app-shell">


    <!--
        GLOBAL NAVIGATION
    -->

    <header class="topbar">

        <a
            class="brand"
            href="{% url 'dashboard' %}"
            aria-label="LedgerFlow home"
        >

            <span
                class="brand-mark"
                aria-hidden="true"
            >
                <span></span>
                <span></span>
                <span></span>
            </span>

            <span>
                LedgerFlow
            </span>

        </a>


        <nav
            class="main-nav"
            aria-label="Primary navigation"
        >

            <a
                href="{% url 'dashboard' %}"
                class="{% if request.resolver_match.url_name == 'dashboard' %}is-active{% endif %}"
            >
                Overview
            </a>


            <a
                href="{% url 'payments' %}"
                class="{% if request.resolver_match.url_name == 'payments' %}is-active{% endif %}"
            >
                Payments
            </a>


            <a
                href="{% url 'simulator' %}"
                class="{% if request.resolver_match.url_name == 'simulator' %}is-active{% endif %}"
            >
                Simulator
            </a>


            <a
                href="{% url 'system' %}"
                class="{% if request.resolver_match.url_name == 'system' %}is-active{% endif %}"
            >
                System
            </a>

        </nav>


        <div class="topbar-meta">

            <span class="mode-pill">
                <span class="mode-dot"></span>
                TEST MODE
            </span>


            <span class="queue-chip">
                {{ metrics.queued_jobs|default:0 }}
                queued
            </span>

        </div>

    </header>



    <!--
        PAGE CONTENT
    -->

    <main class="page">

        {% block content %}

        {% endblock %}

    </main>



    <!--
        FOOTER
    -->

    <footer class="footer">

        <span>
            LedgerFlow
        </span>

        <span>
            Payment reliability simulator
        </span>

        <span>
            PostgreSQL-backed test environment
        </span>

    </footer>


</div>


<script
    src="{% static 'js/ledgerflow.js' %}"
    defer
></script>

</body>

</html>
