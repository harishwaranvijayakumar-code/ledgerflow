services:
  - type: web
    name: ledgerflow-web
    runtime: python
    plan: free

    buildCommand: bash build.sh

    startCommand: python -m gunicorn config.wsgi:application --chdir src

    healthCheckPath: /

    envVars:
      - key: DJANGO_ENV
        value: production

      - key: DJANGO_DEBUG
        value: "false"

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_ALLOWED_HOSTS
        value: ledgerflow-web.onrender.com

      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://ledgerflow-web.onrender.com

      - key: LEDGERFLOW_INLINE_WORKER
        value: "true"

      - key: DATABASE_URL
        fromDatabase:
          name: ledgerflow-db
          property: connectionString


databases:
  - name: ledgerflow-db
    plan: free
    postgresMajorVersion: "17"